name: Create release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install zip
        run: sudo apt install zip

      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Bundle files
        run: |
          mkdir -p ./temp/pulsar-games
          cp ./{README.md,fxmanifest.lua,config.lua,demo_games.lua} ./temp/pulsar-games
          cp -r ./{client,server,ui} ./temp/pulsar-games
          rm -rf ./temp/pulsar-games/ui/node_modules
          cd ./temp && zip -r ../pulsar-games.zip ./pulsar-games

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "PULSAR-GAMES ${{ github.ref_name }}"
          body: |
            ![Pulsar Framework](https://r2.fivemanage.com/GPYOH8Hq4GPyAY7czrgLe/pulsarbanner.png)

            ## PULSAR-GAMES ${{ github.ref_name }}

            Mini-games system for Pulsar Framework — in-world arcade games and interactive entertainment with React UI.

            ### Installation
            1. Download `pulsar-games.zip` below
            2. Extract into your server's `resources` folder
            3. Add `ensure pulsar-games` to your `server.cfg`

            ---
            ![Pulsar Framework](https://img.shields.io/badge/Pulsar-Framework-7c3aed?style=flat-square)
            ![Built for FiveM](https://img.shields.io/badge/Built_for-FiveM-F40552?style=flat-square)
          files: pulsar-games.zip
          prerelease: false
